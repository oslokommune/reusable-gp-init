################################################################################
# Reusable workflow: gp-init
#
# Reusable workflow for performing various initialization work as part of a
# deployment pipeline. Examples of such initialization:
# - Validating the CI/CD configuration against its JSON Schema
# - Enriching the configuration with computed values (concurrency groups,
#   stack directories, app name)
# - Uploading git metadata to Datadog
################################################################################
name: "Golden Path initialization"

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to CI/CD configuration file"
        type: string
        default: ".gp.cicd.json"
        required: false
      app-name:
        type: string
        required: true
        description: "The name of the application (e.g., `example`)"
      stack-name:
        type: string
        required: false
        description: "The name of the Terraform stack (e.g., `app-example`, `applications/app-example`)"
    outputs:
      config:
        description: "The processed CI/CD configuration"
        value: ${{ jobs.gp-init.outputs.config }}
      is_dependency_update_branch:
        description: "Whether the current branch was created by a dependency update bot (Renovate, Dependabot)"
        value: ${{ jobs.gp-init.outputs.is_dependency_update_branch }}
    secrets:
      datadog-api-key:
        required: false
        description: "Datadog API key for git metadata upload"

jobs:
  gp-init:
    name: Initialization
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      config: ${{ steps.config.outputs.config }}
      is_dependency_update_branch: ${{ steps.dependency-update-branch.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect dependency update branch
        id: dependency-update-branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
        run: |
          branch="${HEAD_REF:-${REF#refs/heads/}}"
          if [[ "$branch" == ok-renovate/* || "$branch" == renovate/* || "$branch" == dependabot/* ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build config and store it as output
        id: config
        uses: oslokommune/composite-actions/build-gp-config@7c98b0778ffd46ee658bff6d25408517a030e2bf # v1.7.0
        with:
          config-file: ${{ inputs.config-file }}
          app-name: ${{ inputs.app-name }}
          stack-name: ${{ inputs.stack-name }}

      - name: Upload git metadata
        env:
          DD_API_KEY: ${{ secrets.datadog-api-key }}
          DD_SITE: "datadoghq.eu"
        run: |
          # GitHub Actions does not support conditional checks on secrets,
          # so we need to do this check inside the step itself.
          if [ "$DD_API_KEY" == "" ]; then
            echo "No Datadog API key provided, skipping git metadata upload"
            exit 0
          fi
          # renovate: datasource=npm depName=@datadog/datadog-ci
          DATADOG_CI_VERSION="5.23.0"
          npx "@datadog/datadog-ci@$DATADOG_CI_VERSION" git-metadata upload
